<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RE/MAX · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c10;
    --surface: #13131a;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --gold: #c9a84c;
    --gold-light: #e6c97a;
    --gold-dim: rgba(201,168,76,0.15);
    --text: #e8e8f0;
    --text-muted: #7a7a95;
    --text-dim: #4a4a65;
    --green: #3ecf8e;
    --red: #f05252;
    --orange: #f59e0b;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── LOGIN ─── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .login-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 80%, rgba(96,165,250,0.04) 0%, transparent 60%);
  }

  .login-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
  }

  .login-card {
    position: relative;
    width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.08);
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    text-align: center;
    margin-bottom: 36px;
  }

  .login-logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 50px;
    padding: 8px 20px;
    margin-bottom: 16px;
  }

  .login-logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  .login-logo-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .login-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .login-subtitle {
    font-size: 13px;
    color: var(--text-muted);
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .form-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
  }

  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), #a8883a);
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    color: #0c0c10;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(201,168,76,0.3);
  }

  .btn-login:active { transform: translateY(0); }

  .login-error {
    background: rgba(240,82,82,0.1);
    border: 1px solid rgba(240,82,82,0.3);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--red);
    margin-top: 12px;
    display: none;
  }

  .login-hint {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  /* ─── LOADING ─── */
  #loading-screen {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }

  .loader {
    width: 40px; height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ─── APP ─── */
  #app-screen { display: none; }

  /* Topbar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 64px;
    background: rgba(12,12,16,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 32px;
    gap: 16px;
    z-index: 100;
  }

  .topbar-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--gold);
    flex: 1;
  }

  .topbar-logo span { color: var(--text-muted); font-size: 14px; font-family: 'Sora', sans-serif; font-weight: 400; }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 6px 16px 6px 6px;
  }

  .topbar-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
  }

  .topbar-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  .topbar-role {
    font-size: 11px;
    color: var(--text-muted);
  }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    color: var(--text-muted);
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* Main content */
  .main {
    padding: 96px 32px 48px;
    max-width: 1400px;
    margin: 0 auto;
    animation: fadeUp 0.5s ease both;
  }

  .page-header {
    margin-bottom: 32px;
  }

  .page-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .page-subtitle {
    font-size: 14px;
    color: var(--text-muted);
  }

  /* Tabs (admin) */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 32px;
    width: fit-content;
  }

  .tab-btn {
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    padding: 9px 20px;
    color: var(--text-muted);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.2);
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-color, var(--gold));
    opacity: 0.6;
  }

  .stat-card:hover { border-color: var(--border); transform: translateY(-2px); }

  .stat-icon {
    font-size: 22px;
    margin-bottom: 12px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .stat-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Section */
  .section {
    margin-bottom: 32px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Estado breakdown */
  .estado-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .estado-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .estado-emoji { font-size: 20px; }
  .estado-info { flex: 1; min-width: 0; }
  .estado-name { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .estado-num { font-size: 22px; font-weight: 700; color: var(--text); }

  /* Progress bar */
  .progress-row {
    margin-bottom: 12px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .progress-label strong { color: var(--text); font-weight: 600; }

  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--gold);
    transition: width 1s ease;
  }

  /* Table */
  .table-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .table-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--gold); }

  .filter-select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }

  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead { background: var(--surface2); }

  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(42,42,58,0.5);
    white-space: nowrap;
    color: var(--text);
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(201,168,76,0.03); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-caida { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.2); }
  .badge-vendido { background: rgba(62,207,142,0.1); color: var(--green); border: 1px solid rgba(62,207,142,0.2); }
  .badge-alquilado { background: rgba(96,165,250,0.1); color: var(--blue); border: 1px solid rgba(96,165,250,0.2); }
  .badge-custodia { background: rgba(96,165,250,0.1); color: var(--blue); border: 1px solid rgba(96,165,250,0.2); }
  .badge-devolucion { background: rgba(245,158,11,0.1); color: var(--orange); border: 1px solid rgba(245,158,11,0.2); }
  .badge-redireccion { background: rgba(167,139,250,0.1); color: var(--purple); border: 1px solid rgba(167,139,250,0.2); }

  .punta-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .punta-v { background: rgba(62,207,142,0.1); color: var(--green); }
  .punta-c { background: rgba(96,165,250,0.1); color: var(--blue); }
  .punta-vc { background: rgba(201,168,76,0.15); color: var(--gold); }

  /* Agent ranking table */
  .ranking-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .rank-num {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .rank-1 .rank-num { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--gold); }
  .rank-2 .rank-num { background: rgba(156,163,175,0.1); border-color: #9ca3af; color: #9ca3af; }
  .rank-3 .rank-num { background: rgba(205,127,50,0.1); border-color: #cd7f32; color: #cd7f32; }

  .agent-name-cell {
    font-weight: 500;
    color: var(--text);
  }

  .mini-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mini-bar-track {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .mini-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 4px;
  }

  /* Punta detail cards */
  .puntas-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .punta-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }

  .punta-card-icon { font-size: 24px; margin-bottom: 10px; }
  .punta-card-num { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
  .punta-card-label { font-size: 12px; color: var(--text-muted); }
  .punta-card-pct { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* Charts */
  .chart-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .donut-wrapper {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .donut-svg { flex-shrink: 0; }

  .donut-legend { flex: 1; }

  .donut-legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }

  .donut-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .donut-legend-label { color: var(--text-muted); flex: 1; }
  .donut-legend-val { color: var(--text); font-weight: 600; }

  /* Two col layout */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }

  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .puntas-grid { grid-template-columns: 1fr; }
    .main { padding: 80px 16px 32px; }
    .topbar { padding: 0 16px; }
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state-text { font-size: 14px; }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }

  .pagination-btns { display: flex; gap: 4px; }

  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .page-btn:hover { border-color: var(--gold); color: var(--gold); }
  .page-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

  /* Tooltip */
  [title] { cursor: help; }
</style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div id="login-screen">
  <div class="login-bg"></div>
  <div class="login-grid"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-badge">
        <div class="login-logo-dot"></div>
        <span class="login-logo-text">RE/MAX · Dashboard</span>
      </div>
      <h1 class="login-title">Bienvenido</h1>
      <p class="login-subtitle">Ingresá con tu usuario para continuar</p>
    </div>
    <div class="form-group">
      <label class="form-label">Usuario</label>
      <input type="text" class="form-input" id="username" placeholder="Tu nombre o 'oficina'" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-input" id="password" placeholder="••••••••">
    </div>
    <button class="btn-login" id="btn-login">Ingresar</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos.</div>
    <div class="login-hint">¿Problemas para ingresar? Contactá a la oficina.</div>
  </div>
</div>

<!-- ─── LOADING ─── -->
<div id="loading-screen">
  <div class="loader"></div>
  <p class="loading-text">Cargando datos…</p>
</div>

<!-- ─── APP ─── -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-logo">RE/MAX <span id="topbar-office-name"></span></div>
    <div class="topbar-user">
      <div class="topbar-avatar" id="topbar-avatar">?</div>
      <div>
        <div class="topbar-name" id="topbar-name">—</div>
        <div class="topbar-role" id="topbar-role">—</div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>

  <div class="main" id="main-content"></div>
</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbz9_ADzTA13u7j4WA3gtLo5o4eoBtjZsrSlg0GAwkrh9NH6uEx5HSyiR-KLKoxVadNLaA/exec';

// Usuarios: "oficina" es admin. Agentes usan su nombre (case insensitive) como usuario.
// Contraseña universal (podés cambiarla aquí):
const ADMIN_USER = 'oficina';
const DEFAULT_PASSWORD = 'remax2024';

// ─── STATE ────────────────────────────────────────────────────────────────
let allData = [];
let currentUser = null;
let currentRole = null;
let agentTable_page = 1;
let reservasTable_page = 1;
const PAGE_SIZE = 20;
let filteredReservas = [];
let adminTab = 'resumen';

// ─── INIT ────────────────────────────────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', handleLogin);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

async function handleLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errEl = document.getElementById('login-error');

  if (!username || !password) {
    errEl.textContent = 'Completá usuario y contraseña.';
    errEl.style.display = 'block';
    return;
  }

  if (password !== DEFAULT_PASSWORD) {
    errEl.textContent = 'Contraseña incorrecta.';
    errEl.style.display = 'block';
    return;
  }

  errEl.style.display = 'none';
  showLoading();

  try {
    const res = await fetch(SHEET_URL, { redirect: 'follow', method: 'GET' });
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch(e) {
      throw new Error('La respuesta del script no es JSON válido. Verificá que el script esté publicado correctamente.');
    }
    if (!Array.isArray(data)) throw new Error('Formato inesperado: ' + JSON.stringify(data).substring(0, 100));
    allData = data;

    if (username.toLowerCase() === ADMIN_USER) {
      currentUser = 'Oficina';
      currentRole = 'admin';
    } else {
      // Find matching agent
      const matchedName = findAgentName(username.toLowerCase());
      if (!matchedName) {
        allData = [];
        showLogin();
        errEl.textContent = 'Agente no encontrado en la planilla.';
        errEl.style.display = 'block';
        return;
      }
      currentUser = matchedName;
      currentRole = 'agent';
    }

    showApp();
  } catch (err) {
    showLogin();
    errEl.textContent = 'Error al cargar datos. Verificá la conexión.';
    errEl.style.display = 'block';
  }
}

function findAgentName(query) {
  const allAgents = new Set();
  allData.forEach(r => {
    if (r['Punta Vendedora']) allAgents.add(r['Punta Vendedora'].trim());
    if (r['Punta Compradora']) allAgents.add(r['Punta Compradora'].trim());
  });
  for (const name of allAgents) {
    if (name.toLowerCase() === query) return name;
    if (name.toLowerCase().includes(query) && query.length > 3) return name;
  }
  return null;
}

function showLoading() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'none';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';

  const initials = currentUser.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  document.getElementById('topbar-avatar').textContent = initials;
  document.getElementById('topbar-name').textContent = currentUser;
  document.getElementById('topbar-role').textContent = currentRole === 'admin' ? 'Administrador' : 'Agente';
  document.getElementById('topbar-office-name').textContent = currentRole === 'admin' ? '· Panel Oficina' : '';

  if (currentRole === 'admin') renderAdmin();
  else renderAgent(currentUser);
}

function logout() {
  currentUser = null;
  currentRole = null;
  allData = [];
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  document.getElementById('login-error').style.display = 'none';
  showLogin();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────

function getAgentRows(agentName) {
  return allData.filter(r => {
    const pv = (r['Punta Vendedora'] || '').trim();
    const pc = (r['Punta Compradora'] || '').trim();
    return pv === agentName || pc === agentName;
  });
}

function getPunta(row, agentName) {
  const pv = (row['Punta Vendedora'] || '').trim() === agentName;
  const pc = (row['Punta Compradora'] || '').trim() === agentName;
  if (pv && pc) return 'ambas';
  if (pv) return 'vendedora';
  if (pc) return 'compradora';
  return '-';
}

function estadoBadge(estado) {
  const e = (estado || '').trim().toLowerCase();
  const map = {
    'caída': ['badge-caida', '⚫ Caída'],
    'vendido': ['badge-vendido', '🟢 Vendido'],
    'alquilado': ['badge-alquilado', '🔵 Alquilado'],
    'custodia': ['badge-custodia', '🔵 Custodia'],
    'devolucion': ['badge-devolucion', '🟠 Devolución'],
    'redireccion': ['badge-redireccion', '🟣 Redirección'],
  };
  const [cls, label] = map[e] || ['badge-caida', estado || '-'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function puntaBadge(tipo) {
  if (tipo === 'ambas') return `<span class="badge punta-badge punta-vc">✦ Ambas</span>`;
  if (tipo === 'vendedora') return `<span class="badge punta-badge punta-v">V</span>`;
  if (tipo === 'compradora') return `<span class="badge punta-badge punta-c">C</span>`;
  return '-';
}

function formatDate(val) {
  if (!val) return '-';
  if (val instanceof Date || (typeof val === 'string' && val.includes('T'))) {
    const d = new Date(val);
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  return val;
}

function formatMonto(monto, moneda) {
  if (!monto || monto === '' || isNaN(Number(monto))) return monto || '-';
  const n = Number(monto);
  if (isNaN(n)) return monto;
  return (moneda || '') + ' ' + n.toLocaleString('es-AR');
}

function getAllAgents() {
  const agentMap = {};
  allData.forEach(r => {
    ['Punta Vendedora', 'Punta Compradora'].forEach(col => {
      const name = (r[col] || '').trim();
      if (name && name !== '-') {
        if (!agentMap[name]) agentMap[name] = [];
        agentMap[name].push(r);
      }
    });
  });
  // Deduplicate rows per agent (a row might appear in both punta cols)
  const result = {};
  Object.keys(agentMap).forEach(name => {
    const seen = new Set();
    result[name] = agentMap[name].filter(r => {
      if (seen.has(r['N°Res'])) return false;
      seen.add(r['N°Res']);
      return true;
    });
  });
  return result;
}

function countEstados(rows) {
  const counts = { Caída: 0, Vendido: 0, Alquilado: 0, Custodia: 0, Devolucion: 0, Redireccion: 0 };
  rows.forEach(r => {
    const e = (r['Estado'] || '').trim();
    if (counts.hasOwnProperty(e)) counts[e]++;
  });
  return counts;
}

function filterAgentTable(agentName) {
  const search = document.getElementById('res-search').value.toLowerCase();
  const estadoF = document.getElementById('res-estado-filter').value;
  const puntaF = document.getElementById('res-punta-filter').value;
  const rows = getAgentRows(agentName);

  filteredReservas = rows.filter(r => {
    const matchSearch = !search ||
      (r['Referencia'] || '').toLowerCase().includes(search) ||
      (r['Comprador/Inquilino'] || '').toLowerCase().includes(search) ||
      (r['Localidad'] || '').toLowerCase().includes(search) ||
      String(r['N°Res'] || '').includes(search);
    const matchEstado = !estadoF || (r['Estado'] || '').trim() === estadoF;
    const punta = getPunta(r, agentName);
    const matchPunta = !puntaF || punta === puntaF;
    return matchSearch && matchEstado && matchPunta;
  });

  reservasTable_page = 1;
  document.getElementById('agent-table-container').innerHTML = renderAgentTablePage(filteredReservas, agentName);
  document.getElementById('agent-pagination').innerHTML = renderPagination(filteredReservas.length, reservasTable_page, 'agent');
}

function renderAgentTablePage(rows, agentName) {
  const start = (reservasTable_page - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  if (!pageRows.length) return `<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">No hay reservas que coincidan con los filtros.</div></div>`;

  return `<table>
    <thead><tr>
      <th>N° Res</th>
      <th>Fecha</th>
      <th>Referencia</th>
      <th>Localidad</th>
      <th>Comprador / Inquilino</th>
      <th>Operación</th>
      <th>Punta</th>
      <th>Estado</th>
      <th>Monto Trans.</th>

    <tbody>
    ${pageRows.map(r => `

        <td>${puntaBadge(getPunta(r, agentName))}</td>

        <td style="font-size:12px">${formatMonto(r['Monto de Transacción'], r['Moneda de Transaccion'])}</td>

function filterAdminAgentes() {
  const search = document.getElementById('agent-search').value.toLowerCase();
  const agentMap = getAllAgents();
  const agents = Object.entries(agentMap)
    .filter(([name]) => !search || name.toLowerCase().includes(search))
    .map(([name, rows]) => {
      const estados = countEstados(rows);
      const cerradas = estados.Vendido + estados.Alquilado;
      const pct = rows.length > 0 ? Math.round((cerradas / rows.length) * 100) : 0;
      return { name, total: rows.length, cerradas, caidas: estados.Caída, custodia: estados.Custodia, devolucion: estados.Devolucion, redireccion: estados.Redireccion, vendido: estados.Vendido, alquilado: estados.Alquilado, pct };
    }).sort((a, b) => b.total - a.total);

  document.getElementById('admin-agents-container').innerHTML = `<table>
    <thead><tr>
      <th>Agente</th><th>Total Res.</th><th>Vendido</th><th>Alquilado</th><th>Custodia</th><th>Caídas</th><th>Devolución</th><th>Redirección</th><th>% Cierre</th>
    </tr></thead>
    <tbody>
    ${agents.map(a => `
      <tr>
        <td style="font-weight:500">${a.name}</td>
        <td>${a.total}</td>
        <td style="color:var(--green)">${a.vendido}</td>
        <td style="color:var(--blue)">${a.alquilado}</td>
        <td style="color:var(--blue)">${a.custodia}</td>
        <td style="color:var(--text-muted)">${a.caidas}</td>
        <td style="color:var(--orange)">${a.devolucion}</td>
        <td style="color:var(--purple)">${a.redireccion}</td>
        <td><span style="color:${a.pct >= 50 ? 'var(--green)' : a.pct >= 25 ? 'var(--orange)' : 'var(--red)'};font-weight:600">${a.pct}%</span></td>
      </tr>
    `).join('')}
    </tbody>
  </table>`;
}

function renderAdminReservas() {
  return `
    <div class="table-wrapper">
      <div class="table-toolbar">
        <input type="text" class="search-input" id="all-res-search" placeholder="🔍  Buscar por agente, referencia, comprador, localidad…" oninput="filterAdminReservas()">
        <select class="filter-select" id="all-estado-filter" onchange="filterAdminReservas()">
          <option value="">Todos los estados</option>
          <option value="Vendido">Vendido</option>
          <option value="Alquilado">Alquilado</option>
          <option value="Custodia">Custodia</option>
          <option value="Caída">Caída</option>
          <option value="Devolucion">Devolución</option>
          <option value="Redireccion">Redirección</option>
        </select>
        <select class="filter-select" id="all-op-filter" onchange="filterAdminReservas()">
          <option value="">Toda operación</option>
          <option value="Venta">Venta</option>
          <option value="Alquiler">Alquiler</option>
        </select>
      </div>
      <div class="table-scroll" id="all-res-container">
        ${renderAllReservasPage()}
      </div>
      <div class="pagination" id="all-res-pagination">
        ${renderPagination(filteredReservas.length, reservasTable_page, 'adminReservas')}
      </div>
    </div>
  `;
}

function filterAdminReservas() {
  const search = (document.getElementById('all-res-search')?.value || '').toLowerCase();
  const estadoF = document.getElementById('all-estado-filter')?.value || '';
  const opF = document.getElementById('all-op-filter')?.value || '';

  filteredReservas = allData.filter(r => {
    const matchSearch = !search ||
      (r['Punta Vendedora'] || '').toLowerCase().includes(search) ||
      (r['Punta Compradora'] || '').toLowerCase().includes(search) ||
      (r['Referencia'] || '').toLowerCase().includes(search) ||
      (r['Comprador/Inquilino'] || '').toLowerCase().includes(search) ||
      (r['Localidad'] || '').toLowerCase().includes(search) ||
      String(r['N°Res'] || '').includes(search);
    const matchEstado = !estadoF || (r['Estado'] || '').trim() === estadoF;
    const matchOp = !opF || (r['Operacion'] || '').trim() === opF;
    return matchSearch && matchEstado && matchOp;
  });

  reservasTable_page = 1;
  document.getElementById('all-res-container').innerHTML = renderAllReservasPage();
  document.getElementById('all-res-pagination').innerHTML = renderPagination(filteredReservas.length, reservasTable_page, 'adminReservas');
}

function renderAllReservasPage() {
  const start = (reservasTable_page - 1) * PAGE_SIZE;
  const pageRows = filteredReservas.slice(start, start + PAGE_SIZE);
  if (!pageRows.length) return `<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">No hay resultados.</div></div>`;

  return `<table>
    <thead><tr>
      <th>N° Res</th>
      <th>Fecha</th>
      <th>Punta Vendedora</th>
      <th>Punta Compradora</th>
      <th>Referencia</th>
      <th>Localidad</th>
      <th>Operación</th>
      <th>Estado</th>
      <th>Monto Trans.</th>
    </tr></thead>
    <tbody>
    ${pageRows.map(r => `
      <tr>
        <td style="color:var(--text-muted);font-size:12px">#${r['N°Res'] || '-'}</td>
        <td style="color:var(--text-muted)">${formatDate(r['Fecha'])}</td>
        <td style="font-weight:500">${r['Punta Vendedora'] || '-'}</td>
        <td>${r['Punta Compradora'] || '-'}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${r['Referencia'] || ''}">${r['Referencia'] || '-'}</td>
        <td>${r['Localidad'] || '-'}</td>
        <td style="font-size:12px;color:var(--text-muted)">${r['Operacion'] || '-'}</td>
        <td>${estadoBadge(r['Estado'])}</td>
        <td style="font-size:12px">${formatMonto(r['Monto de Transacción'], r['Moneda de Transaccion'])}</td>
      </tr>
    `).join('')}
    </tbody>
  </table>`;
}

// ─── CHARTS ──────────────────────────────────────────────────────────────

function renderDonut(estados, total) {
  const data = [
    { label: 'Vendido', value: estados.Vendido, color: '#3ecf8e' },
    { label: 'Alquilado', value: estados.Alquilado, color: '#60a5fa' },
    { label: 'Custodia', value: estados.Custodia, color: '#818cf8' },
    { label: 'Caída', value: estados.Caída, color: '#6b7280' },
    { label: 'Devolución', value: estados.Devolucion, color: '#f59e0b' },
    { label: 'Redirección', value: estados.Redireccion, color: '#a78bfa' },
  ].filter(d => d.value > 0);

  if (!data.length || total === 0) return '<div style="color:var(--text-muted);font-size:13px">Sin datos</div>';

  const r = 60, cx = 70, cy = 70, stroke = 22;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const slices = data.map(d => {
    const pct = d.value / total;
    const dash = pct * circumference;
    const gap = circumference - dash;
    const slice = { ...d, dash, gap, offset };
    offset += dash;
    return slice;
  });

  const svg = `<svg width="140" height="140" class="donut-svg">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/>
    ${slices.map(s => `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}"
        stroke-dasharray="${s.dash} ${s.gap}"
        stroke-dashoffset="${circumference/4 - s.offset}"
        transform="rotate(-90 ${cx} ${cy})"
        style="transition: stroke-dasharray 0.8s ease"/>
    `).join('')}
    <text x="${cx}" y="${cy - 6}" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="700" font-family="Sora">${total}</text>
    <text x="${cx}" y="${cy + 10}" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Sora">total</text>
  </svg>`;

  const legend = `<div class="donut-legend">
    ${data.map(d => `
      <div class="donut-legend-item">
        <div class="donut-dot" style="background:${d.color}"></div>
        <span class="donut-legend-label">${d.label}</span>
        <span class="donut-legend-val">${d.value} <span style="color:var(--text-dim);font-size:11px">(${Math.round(d.value/total*100)}%)</span></span>
      </div>
    `).join('')}
  </div>`;

  return `<div class="donut-wrapper">${svg}${legend}</div>`;
}

function renderProgressBars(estados, total) {
  const items = [
    { label: 'Vendido', value: estados.Vendido, color: 'var(--green)' },
    { label: 'Alquilado', value: estados.Alquilado, color: 'var(--blue)' },
    { label: 'Custodia', value: estados.Custodia, color: 'var(--purple)' },
    { label: 'Caída', value: estados.Caída, color: '#6b7280' },
    { label: 'Devolución', value: estados.Devolucion, color: 'var(--orange)' },
    { label: 'Redirección', value: estados.Redireccion, color: 'var(--purple)' },
  ];

  return items.map(item => {
    const pct = total > 0 ? Math.round((item.value / total) * 100) : 0;
    return `<div class="progress-row">
      <div class="progress-label">
        <span>${item.label}</span>
        <strong>${item.value} <span style="color:var(--text-dim)">(${pct}%)</span></strong>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%; background:${item.color}"></div>
      </div>
    </div>`;
  }).join('');
}

// ─── PAGINATION ───────────────────────────────────────────────────────────

function renderPagination(totalItems, currentPage, context) {
  const totalPages = Math.ceil(totalItems / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, totalItems);

  if (totalItems === 0) return '<span>Sin resultados</span><div></div>';

  const pages = [];
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
      pages.push(i);
    } else if (pages[pages.length - 1] !== '...') {
      pages.push('...');
    }
  }

  const btns = pages.map(p => {
    if (p === '...') return `<span class="page-btn" style="cursor:default">…</span>`;
    return `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="changePage(${p}, '${context}')">${p}</button>`;
  }).join('');

  return `<span>Mostrando ${start}–${end} de ${totalItems}</span><div class="pagination-btns">${btns}</div>`;
}

function changePage(page, context) {
  if (context === 'agent') {
    reservasTable_page = page;
    document.getElementById('agent-table-container').innerHTML = renderAgentTablePage(filteredReservas, currentUser);
    document.getElementById('agent-pagination').innerHTML = renderPagination(filteredReservas.length, page, 'agent');
  } else if (context === 'adminAgentes') {
    agentTable_page = page;
    renderAdmin();
  } else if (context === 'adminReservas') {
    reservasTable_page = page;
    document.getElementById('all-res-container').innerHTML = renderAllReservasPage();
    document.getElementById('all-res-pagination').innerHTML = renderPagination(filteredReservas.length, page, 'adminReservas');
  }
}
