<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RE/MAX Confluencia · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c0c10; --surface:#13131a; --surface2:#1a1a24; --border:#2a2a3a;
    --gold:#c9a84c; --gold-dim:rgba(201,168,76,0.15); --gold-border:rgba(201,168,76,0.3);
    --text:#e8e8f0; --text-muted:#7a7a95; --text-dim:#4a4a65;
    --green:#3ecf8e; --red:#f05252; --orange:#f59e0b; --blue:#60a5fa; --purple:#a78bfa;
    --radius:12px; --radius-sm:8px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

  /* ── LOGIN ── */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(201,168,76,0.07) 0%,transparent 70%);}
  .login-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:0.25;}
  .login-card{position:relative;width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px;box-shadow:0 40px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(201,168,76,0.06);animation:fadeUp 0.5s ease both;}
  .login-badge{display:inline-flex;align-items:center;gap:8px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:50px;padding:7px 18px;margin-bottom:20px;}
  .login-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .login-badge-text{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
  .login-title{font-family:"DM Serif Display",serif;font-size:26px;margin-bottom:5px;}
  .login-sub{font-size:13px;color:var(--text-muted);margin-bottom:32px;}
  .form-label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
  .form-group{margin-bottom:18px;}
  .form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-family:"Sora",sans-serif;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
  .form-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.1);}
  .btn-login{width:100%;background:linear-gradient(135deg,var(--gold),#a8883a);border:none;border-radius:var(--radius-sm);padding:14px;color:#0c0c10;font-family:"Sora",sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:6px;}
  .btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(201,168,76,0.3);}
  .login-error{background:rgba(240,82,82,0.08);border:1px solid rgba(240,82,82,0.25);border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;color:var(--red);margin-top:12px;display:none;}

  /* ── APP ── */
  #app-screen{display:none;}
  .topbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(12,12,16,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;gap:12px;z-index:100;}
  .topbar-logo{font-family:"DM Serif Display",serif;font-size:19px;color:var(--gold);flex:1;}
  .topbar-logo span{color:var(--text-muted);font-size:12px;font-family:"Sora",sans-serif;font-weight:400;margin-left:8px;}
  .topbar-user{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:5px 14px 5px 5px;}
  .topbar-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);}
  .topbar-name{font-size:13px;font-weight:500;}
  .topbar-role{font-size:11px;color:var(--text-muted);}
  .btn-back{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 14px;color:var(--text-muted);font-family:"Sora",sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s;display:none;}
  .btn-back.show{display:block;}
  .btn-back:hover{border-color:var(--gold);color:var(--gold);}
  .btn-logout{background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 13px;color:var(--text-muted);font-family:"Sora",sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s;}
  .btn-logout:hover{border-color:var(--red);color:var(--red);}

  .main{padding:88px 32px 48px;max-width:1400px;margin:0 auto;animation:fadeUp 0.4s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .page-title{font-family:"DM Serif Display",serif;font-size:28px;margin-bottom:5px;}
  .page-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:26px;}

  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:26px;width:fit-content;}
  .tab-btn{background:transparent;border:none;border-radius:var(--radius-sm);padding:8px 18px;color:var(--text-muted);font-family:"Sora",sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;}
  .tab-btn.active{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(201,168,76,0.2);}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px;margin-bottom:26px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:19px;position:relative;overflow:hidden;transition:transform 0.2s;}
  .stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent,var(--gold));opacity:0.7;}
  .stat-card:hover{transform:translateY(-2px);}
  .stat-icon{font-size:19px;margin-bottom:9px;}
  .stat-value{font-size:27px;font-weight:700;line-height:1;margin-bottom:4px;}
  .stat-label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .stat-sub{font-size:11px;color:var(--text-dim);margin-top:3px;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:26px;}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}.main{padding:80px 16px 32px}}

  .chart-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:13px;}
  .chart-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;}
  .donut-wrap{display:flex;align-items:center;gap:22px;}
  .donut-legend{flex:1;}
  .donut-item{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
  .donut-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .donut-item-label{color:var(--text-muted);flex:1;}
  .donut-item-val{color:var(--text);font-weight:600;}
  .prog-row{margin-bottom:9px;}
  .prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:4px;}
  .prog-label strong{color:var(--text);}
  .prog-track{height:5px;background:var(--surface2);border-radius:4px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:4px;}

  .puntas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:26px;}
  .punta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;text-align:center;}
  .punta-icon{font-size:20px;margin-bottom:7px;}
  .punta-num{font-size:28px;font-weight:700;margin-bottom:3px;}
  .punta-label{font-size:12px;color:var(--text-muted);}
  .punta-pct{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:26px;}
  .table-toolbar{display:flex;gap:9px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .srch{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-family:"Sora",sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;}
  .srch:focus{border-color:var(--gold);}
  .flt{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-family:"Sora",sans-serif;font-size:13px;outline:none;cursor:pointer;}
  .tbl-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead{background:var(--surface2);}
  th{padding:10px 13px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--border);}
  td{padding:10px 13px;border-bottom:1px solid rgba(42,42,58,0.4);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(201,168,76,0.03);}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:50px;font-size:11px;font-weight:600;white-space:nowrap;}
  .b-caida{background:rgba(107,114,128,0.15);color:#9ca3af;border:1px solid rgba(107,114,128,0.2);}
  .b-vendido{background:rgba(62,207,142,0.1);color:var(--green);border:1px solid rgba(62,207,142,0.2);}
  .b-alquilado{background:rgba(96,165,250,0.1);color:var(--blue);border:1px solid rgba(96,165,250,0.2);}
  .b-custodia{background:rgba(96,165,250,0.1);color:var(--blue);border:1px solid rgba(96,165,250,0.2);}
  .b-devolucion{background:rgba(245,158,11,0.1);color:var(--orange);border:1px solid rgba(245,158,11,0.2);}
  .b-redireccion{background:rgba(167,139,250,0.1);color:var(--purple);border:1px solid rgba(167,139,250,0.2);}
  .pt-v{background:rgba(62,207,142,0.1);color:var(--green);font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;}
  .pt-c{background:rgba(96,165,250,0.1);color:var(--blue);font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;}
  .pt-vc{background:rgba(201,168,76,0.15);color:var(--gold);font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;}

  .pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--text-muted);}
  .pager-btns{display:flex;gap:4px;}
  .pg{background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;font-size:12px;transition:all 0.2s;font-family:"Sora",sans-serif;}
  .pg:hover{border-color:var(--gold);color:var(--gold);}
  .pg.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}

  .rk{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-muted);}
  .r1 .rk{background:rgba(201,168,76,0.15);border-color:var(--gold);color:var(--gold);}
  .r2 .rk{background:rgba(156,163,175,0.1);border-color:#9ca3af;color:#9ca3af;}
  .r3 .rk{background:rgba(205,127,50,0.1);border-color:#cd7f32;color:#cd7f32;}
  .mini-bar{display:flex;align-items:center;gap:7px;}
  .mini-track{flex:1;height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;}
  .mini-fill{height:100%;background:var(--green);border-radius:4px;}

  .agt-row{cursor:pointer;}
  .agt-row:hover td{background:rgba(201,168,76,0.05) !important;}

  .agent-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .agent-avatar-lg{width:50px;height:50px;border-radius:50%;background:var(--gold-dim);border:2px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--gold);flex-shrink:0;}
  .agent-detail-name{font-family:"DM Serif Display",serif;font-size:21px;}
  .agent-detail-sub{font-size:13px;color:var(--text-muted);margin-top:2px;}

  .empty{text-align:center;padding:48px;color:var(--text-muted);font-size:14px;}
</style>
</head>

  <div class="main" id="app"></div>

const PAGE = 20;

// ─── LOGIN ─────────────────────────────────────────────────────────────────
document.getElementById('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('inp-user').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogin() {
  const u = document.getElementById('inp-user').value.trim().toLowerCase();
  const p = document.getElementById('inp-pass').value.trim();
  const err = document.getElementById('login-err');
  const match = USERS[u];
  if (!match || match.pass !== p) {
    err.style.display = 'block';
    err.textContent = 'Usuario o contraseña incorrectos.';
    return;
  }
  err.style.display = 'none';
  currentUser = match;
  // topbar
  const initials = match.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  document.getElementById('tb-avatar').textContent = initials;
  document.getElementById('tb-name').textContent = match.name;
  document.getElementById('tb-role').textContent = match.role === 'admin' ? 'Administrador' : 'Agente';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  if (match.role === 'admin') { tab='resumen'; render(); }
  else { renderAgentView(match.name); }
}

function doLogout() {
  currentUser = null; currentAgent = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('inp-user').value = '';
  document.getElementById('inp-pass').value = '';
  document.getElementById('btn-back').classList.remove('show');
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function isOfi(name) {
  return Object.values(USERS).some(u => u.role==='agent' && u.name===name);
}

function getOfiAgentMap() {
  const m = {};
  DATA.forEach(r => {
    ['Punta Vendedora','Punta Compradora'].forEach(col => {
      const n = (r[col]||'').trim();
      if (n && n!=='-' && isOfi(n)) {
        if (!m[n]) m[n] = new Set();
        m[n].add(r);
      }
    });
  });
  const out = {};
  Object.keys(m).forEach(n => { out[n] = [...m[n]]; });
  return out;
}

function getAgentRows(name) {
  return DATA.filter(r =>
    (r['Punta Vendedora']||'').trim()===name ||
    (r['Punta Compradora']||'').trim()===name
  );
}

function getPunta(r, name) {
  const pv=(r['Punta Vendedora']||'').trim()===name;
  const pc=(r['Punta Compradora']||'').trim()===name;
  if(pv&&pc) return 'ambas';
  if(pv) return 'vendedora';
  if(pc) return 'compradora';
  return '-';
}

function getCounterpart(r, name) {
  const pv=(r['Punta Vendedora']||'').trim();
  const pc=(r['Punta Compradora']||'').trim();
  if(pv===name&&pc===name) return '—';
  if(pv===name) return pc||'—';
  if(pc===name) return pv||'—';
  return '—';
}

function puntaBadge(t) {
  if(t==='ambas') return '<span class="pt-vc">✦ Ambas</span>';
  if(t==='vendedora') return '<span class="pt-v">Vendedora</span>';
  if(t==='compradora') return '<span class="pt-c">Compradora</span>';
  return '-';
}

function stateBadge(e) {
  const m={'Caída':['b-caida','⚫ Caída'],'Vendido':['b-vendido','🟢 Vendido'],'Alquilado':['b-alquilado','🔵 Alquilado'],'Custodia':['b-custodia','🔵 Custodia'],'Devolucion':['b-devolucion','🟠 Devolución'],'Redireccion':['b-redireccion','🟣 Redirección']};
  const [cls,label]=m[(e||'').trim()]||['b-caida',e||'-'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function fDate(v) {
  if(!v) return '-';
  const d=new Date(v);
  return isNaN(d)?v:d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function countEstados(rows) {
  const c={Caída:0,Vendido:0,Alquilado:0,Custodia:0,Devolucion:0,Redireccion:0};
  rows.forEach(r=>{const e=(r['Estado']||'').trim();if(c.hasOwnProperty(e))c[e]++;});
  return c;
}

function calcPct(e) {
  const c=e.Vendido+e.Alquilado, n=e.Caída+e.Devolucion;
  return (c+n)>0?Math.round(c/(c+n)*100):0;
}

function pager(total,cur,ctx) {
  const pages=Math.ceil(total/PAGE),s=(cur-1)*PAGE+1,en=Math.min(cur*PAGE,total);
  if(!total) return '<span>Sin resultados</span><div></div>';
  const nums=[];
  for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-cur)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…');}
  const btns=nums.map(p=>p==='…'?'<span class="pg" style="cursor:default">…</span>':`<button class="pg ${p===cur?'on':''}" onclick="chPage(${p},'${ctx}')">${p}</button>`).join('');
  return `<span>Mostrando ${s}–${en} de ${total}</span><div class="pager-btns">${btns}</div>`;
}

function chPage(p,ctx) {
  if(ctx==='res'){resPage=p;document.getElementById('res-body').innerHTML=resTableBody();document.getElementById('res-pager').innerHTML=pager(filteredRes.length,p,'res');}
  if(ctx==='agt'){agtPage=p;document.getElementById('agt-body').innerHTML=agtTableBody();document.getElementById('agt-pager').innerHTML=pager(filteredAgt().length,p,'agt');}
  if(ctx==='agt-res'){agtResPage=p;document.getElementById('agt-res-body').innerHTML=agtResBody();document.getElementById('agt-res-pager').innerHTML=pager(filteredAgtRes().length,p,'agt-res');}
}

// ─── CHARTS ────────────────────────────────────────────────────────────────
function donut(e,total) {
  if(!total) return '<div style="color:var(--text-muted);font-size:13px">Sin datos</div>';
  const items=[{l:'Vendido',v:e.Vendido,c:'#3ecf8e'},{l:'Alquilado',v:e.Alquilado,c:'#60a5fa'},{l:'Custodia',v:e.Custodia,c:'#818cf8'},{l:'Caída / Dev.',v:e.Caída+e.Devolucion,c:'#6b7280'},{l:'Redirección',v:e.Redireccion,c:'#a78bfa'}].filter(i=>i.v>0);
  const r=60,cx=70,cy=70,stroke=22,circ=2*Math.PI*r;let off=0;
  const slices=items.map(i=>{const dash=(i.v/total)*circ,gap=circ-dash,s={...i,dash,gap,off};off+=dash;return s;});
  const svg=`<svg width="140" height="140"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/>${slices.map(s=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" stroke-dasharray="${s.dash} ${s.gap}" stroke-dashoffset="${circ/4-s.off}" transform="rotate(-90 ${cx} ${cy})"/>`).join("")}<text x="${cx}" y="${cy-5}" text-anchor="middle" fill="var(--text)" font-size="17" font-weight="700" font-family="Sora">${total}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-family="Sora">total</text></svg>`;
  const legend=`<div class="donut-legend">${items.map(i=>`<div class="donut-item"><div class="donut-dot" style="background:${i.c}"></div><span class="donut-item-label">${i.l}</span><span class="donut-item-val">${i.v} <span style="color:var(--text-dim);font-size:10px">(${Math.round(i.v/total*100)}%)</span></span></div>`).join('')}</div>`;
  return `<div class="donut-wrap">${svg}${legend}</div>`;
}

function progBars(e,total) {
  return [{l:'Vendido',v:e.Vendido,c:'var(--green)'},{l:'Alquilado',v:e.Alquilado,c:'var(--blue)'},{l:'Custodia',v:e.Custodia,c:'var(--purple)'},{l:'Caída + Devolución',v:e.Caída+e.Devolucion,c:'#6b7280'},{l:'Redirección',v:e.Redireccion,c:'var(--purple)'}].map(i=>{
    const pct=total>0?Math.round(i.v/total*100):0;
    return `<div class="prog-row"><div class="prog-label"><span>${i.l}</span><strong>${i.v} <span style="color:var(--text-dim)">(${pct}%)</span></strong></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${i.c}"></div></div></div>`;
  }).join('');
}

function renderResumen() {
  const e=countEstados(DATA),total=DATA.length,cerradas=e.Vendido+e.Alquilado,pct=calcPct(e);
  const agMap=getOfiAgentMap(),nAgt=Object.keys(agMap).length;
  return `
    <div class="stats-grid">
      <div class="stat-card" style="--accent:var(--gold)"><div class="stat-icon">📋</div><div class="stat-value">${total}</div><div class="stat-label">Reservas Totales</div></div>
      <div class="stat-card" style="--accent:var(--green)"><div class="stat-icon">🏆</div><div class="stat-value">${cerradas}</div><div class="stat-label">Operaciones Cerradas</div><div class="stat-sub">Vendidas + Alquiladas</div></div>
      <div class="stat-card" style="--accent:var(--blue)"><div class="stat-icon">📊</div><div class="stat-value">${pct}%</div><div class="stat-label">Tasa de Cierre</div><div class="stat-sub">Sobre op. resueltas</div></div>
      <div class="stat-card" style="--accent:#6b7280"><div class="stat-icon">⚫</div><div class="stat-value">${e.Caída+e.Devolucion}</div><div class="stat-label">Caídas + Devoluciones</div></div>
      <div class="stat-card" style="--accent:var(--blue)"><div class="stat-icon">🔵</div><div class="stat-value">${e.Custodia}</div><div class="stat-label">En Custodia</div></div>
      <div class="stat-card" style="--accent:var(--purple)"><div class="stat-icon">👥</div><div class="stat-value">${nAgt}</div><div class="stat-label">Agentes Activos</div></div>
    </div>
    <div class="two-col">
      <div class="chart-box"><div class="chart-title">Distribución por Estado</div>${donut(e,total)}</div>
      <div class="chart-box"><div class="chart-title">Detalle por Estado</div>${progBars(e,total)}</div>
    </div>
    <div class="chart-box"><div class="chart-title">Top 10 Agentes (Oficina) por Cierres</div><div class="tbl-scroll">${topAgtTable(agMap)}</div></div>`;
}

function topAgtTable(agMap) {
  const ranked=Object.entries(agMap).map(([n,rows])=>{const e=countEstados(rows),c=e.Vendido+e.Alquilado;return{n,total:rows.length,c,e,pct:calcPct(e)};}).sort((a,b)=>b.c-a.c).slice(0,10);
  const max=ranked[0]?.c||1;
  return `<table><thead><tr><th>#</th><th>Agente</th><th>Total</th><th>Cerradas</th><th>Caídas+Dev.</th><th>% Cierre</th><th style="min-width:90px">Barra</th></tr></thead><tbody>
  ${ranked.map((a,i)=>`<tr class="r${i+1}"><td><div class="rk">${i+1}</div></td><td style="font-weight:500">${a.n}</td><td style="color:var(--text-muted)">${a.total}</td><td style="color:var(--green);font-weight:600">${a.c}</td><td style="color:#9ca3af">${a.e.Caída+a.e.Devolucion}</td><td style="color:var(--gold);font-weight:600">${a.pct}%</td><td><div class="mini-bar"><div class="mini-track"><div class="mini-fill" style="width:${Math.round(a.c/max*100)}%"></div></div></div></td></tr>`).join('')}
  </tbody></table>`;
}

function filteredAgt() {
  if(_filtAgt) return _filtAgt;
  const s=(document.getElementById('agt-srch')?.value||'').toLowerCase();
  const agMap=getOfiAgentMap();
  _filtAgt=Object.entries(agMap).map(([n,rows])=>{const e=countEstados(rows),c=e.Vendido+e.Alquilado;return{n,total:rows.length,c,e,pct:calcPct(e)};}).filter(a=>!s||a.n.toLowerCase().includes(s)).sort((a,b)=>b.total-a.total);
  return _filtAgt;
}

function agtTableBody() {

  if(!rows.length) return '<div class="empty">Sin resultados.</div>';
  return `<table><thead><tr><th>N° Res</th><th>Fecha</th><th>Punta Vendedora</th><th>Punta Compradora</th><th>Referencia</th><th>Localidad</th><th>Operación</th><th>Estado</th><th>Monto Trans.</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td style="color:var(--text-muted);font-size:12px">#${r['N°Res']||'-'}</td><td style="color:var(--text-muted)">${fDate(r['Fecha'])}</td><td style="font-weight:500">${r['Punta Vendedora']||'-'}</td><td>${r['Punta Compradora']||'-'}</td><td style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${r['Referencia']||''}">${r['Referencia']||'-'}</td><td>${r['Localidad']||'-'}</td><td style="font-size:12px;color:var(--text-muted)">${r['Operacion']||'-'}</td><td>${stateBadge(r['Estado'])}</td><td style="font-size:12px">${r['Moneda de Transaccion']||''} ${r['Monto de Transacción']?Number(r['Monto de Transacción']).toLocaleString('es-AR'):'-'}</td></tr>`).join('')}
  </tbody></table>`;
}

function filterRes() {
  const s=(document.getElementById('res-srch')?.value||'').toLowerCase(),ef=(document.getElementById('res-est')?.value||''),o=(document.getElementById('res-op')?.value||'');
  filteredRes=DATA.filter(r=>{
    const ms=!s||(r['Punta Vendedora']||'').toLowerCase().includes(s)||(r['Punta Compradora']||'').toLowerCase().includes(s)||(r['Referencia']||'').toLowerCase().includes(s)||(r['Comprador/Inquilino']||'').toLowerCase().includes(s)||(r['Localidad']||'').toLowerCase().includes(s)||String(r['N°Res']||'').includes(s);
    return ms&&(!ef||(r['Estado']||'').trim()===ef)&&(!o||(r['Operacion']||'').trim()===o);
  });
  resPage=1;document.getElementById('res-body').innerHTML=resTableBody();document.getElementById('res-pager').innerHTML=pager(filteredRes.length,resPage,'res');
}

function renderResTab() {
  filteredRes=[...DATA];
  return `<div class="table-wrap">
    <div class="table-toolbar">
      <input class="srch" id="res-srch" placeholder="🔍  Buscar por agente, referencia, comprador…" oninput="filterRes()">
      <select class="flt" id="res-est" onchange="filterRes()"><option value="">Todos los estados</option><option>Vendido</option><option>Alquilado</option><option>Custodia</option><option value="Caída">Caída</option><option value="Devolucion">Devolución</option><option value="Redireccion">Redirección</option></select>
      <select class="flt" id="res-op" onchange="filterRes()"><option value="">Toda operación</option><option>Venta</option><option>Alquiler</option></select>
    </div>
    <div class="tbl-scroll" id="res-body">${resTableBody()}</div>
    <div class="pager" id="res-pager">${pager(filteredRes.length,resPage,'res')}</div>
  </div>`;
}

// ─── DETALLE AGENTE (admin ve al hacer click) ───────────────────────────────
function filteredAgtRes() {
  if(_filtAgtRes) return _filtAgtRes;
  const s=(document.getElementById('agt-res-srch')?.value||'').toLowerCase(),ef=(document.getElementById('agt-res-est')?.value||'');
  const rows=getAgentRows(currentAgent);
  _filtAgtRes=rows.filter(r=>{
    const ms=!s||(r['Referencia']||'').toLowerCase().includes(s)||(r['Comprador/Inquilino']||'').toLowerCase().includes(s)||(r['Localidad']||'').toLowerCase().includes(s)||String(r['N°Res']||'').includes(s);
    return ms&&(!ef||(r['Estado']||'').trim()===ef);
  });
  return _filtAgtRes;
}

function agtResBody() {
  const rows=filteredAgtRes(),start=(agtResPage-1)*PAGE,page=rows.slice(start,start+PAGE);
  if(!page.length) return '<div class="empty">Sin reservas.</div>';
  return `<table><thead><tr><th>N° Res</th><th>Fecha</th><th>Punta</th><th>Contraparte</th><th>Referencia</th><th>Localidad</th><th>Operación</th><th>Estado</th><th>Monto Trans.</th></tr></thead><tbody>
  ${page.map(r=>`<tr><td style="color:var(--text-muted);font-size:12px">#${r['N°Res']||'-'}</td><td style="color:var(--text-muted)">${fDate(r['Fecha'])}</td><td>${puntaBadge(getPunta(r,currentAgent))}</td><td style="font-weight:500">${getCounterpart(r,currentAgent)}</td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis" title="${r['Referencia']||''}">${r['Referencia']||'-'}</td><td>${r['Localidad']||'-'}</td><td style="font-size:12px;color:var(--text-muted)">${r['Operacion']||'-'}</td><td>${stateBadge(r['Estado'])}</td><td style="font-size:12px">${r['Moneda de Transaccion']||''} ${r['Monto de Transacción']?Number(r['Monto de Transacción']).toLocaleString('es-AR'):'-'}</td></tr>`).join('')}
  </tbody></table>`;
}

function openAgent(name) {
  currentAgent=name;
  document.getElementById('btn-back').classList.add('show');
  _filtAgtRes=null; agtResPage=1;
  renderAgentDetail(name);
}

function goBack() {
  currentAgent=null;
  document.getElementById('btn-back').classList.remove('show');
  render();
}

// ─── VISTA AGENTE (agente logueado o admin viendo detalle) ──────────────────
function renderAgentView(name) {
  currentAgent = name;
  renderAgentDetail(name);
}

function renderAgentDetail(name) {
  const rows=getAgentRows(name),e=countEstados(rows),total=rows.length;
  const cerradas=e.Vendido+e.Alquilado,pct=calcPct(e);
  const soloV=rows.filter(r=>getPunta(r,name)==='vendedora').length;
  const soloC=rows.filter(r=>getPunta(r,name)==='compradora').length;
  const ambas=rows.filter(r=>getPunta(r,name)==='ambas').length;
  const initials=name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();

  document.getElementById('app').innerHTML = `
    <div class="agent-header">
      <div class="agent-avatar-lg">${initials}</div>
      <div>
        <div class="agent-detail-name">${name}</div>
        <div class="agent-detail-sub">RE/MAX Confluencia · ${total} reserva${total!==1?'s':''} registrada${total!==1?'s':''}</div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card" style="--accent:var(--gold)"><div class="stat-icon">📋</div><div class="stat-value">${total}</div><div class="stat-label">Reservas Totales</div></div>
      <div class="stat-card" style="--accent:var(--green)"><div class="stat-icon">🏆</div><div class="stat-value">${cerradas}</div><div class="stat-label">Operaciones Cerradas</div></div>
      <div class="stat-card" style="--accent:var(--blue)"><div class="stat-icon">📊</div><div class="stat-value">${pct}%</div><div class="stat-label">Tasa de Cierre</div><div class="stat-sub">Sobre op. resueltas</div></div>
      <div class="stat-card" style="--accent:#6b7280"><div class="stat-icon">⚫</div><div class="stat-value">${e.Caída+e.Devolucion}</div><div class="stat-label">Caídas + Devoluciones</div></div>
      <div class="stat-card" style="--accent:var(--blue)"><div class="stat-icon">🔵</div><div class="stat-value">${e.Custodia}</div><div class="stat-label">En Custodia</div></div>
    </div>
    <div class="puntas-grid">
      <div class="punta-card"><div class="punta-icon">📤</div><div class="punta-num" style="color:var(--green)">${soloV}</div><div class="punta-label">Solo Vendedora</div><div class="punta-pct">${total>0?Math.round(soloV/total*100):0}% del total</div></div>
      <div class="punta-card"><div class="punta-icon">📥</div><div class="punta-num" style="color:var(--blue)">${soloC}</div><div class="punta-label">Solo Compradora</div><div class="punta-pct">${total>0?Math.round(soloC/total*100):0}% del total</div></div>
      <div class="punta-card"><div class="punta-icon">✦</div><div class="punta-num" style="color:var(--gold)">${ambas}</div><div class="punta-label">Ambas Puntas</div><div class="punta-pct">${total>0?Math.round(ambas/total*100):0}% del total</div></div>
    </div>
    <div class="two-col">
      <div class="chart-box"><div class="chart-title">Estados</div>${donut(e,total)}</div>
      <div class="chart-box"><div class="chart-title">Detalle</div>${progBars(e,total)}</div>
    </div>
    <div class="table-wrap">
      <div class="table-toolbar">
        <input class="srch" id="agt-res-srch" placeholder="🔍  Buscar por referencia, comprador, localidad…" oninput="_filtAgtRes=null;agtResPage=1;document.getElementById('agt-res-body').innerHTML=agtResBody();document.getElementById('agt-res-pager').innerHTML=pager(filteredAgtRes().length,agtResPage,'agt-res')">
        <select class="flt" id="agt-res-est" onchange="_filtAgtRes=null;agtResPage=1;document.getElementById('agt-res-body').innerHTML=agtResBody();document.getElementById('agt-res-pager').innerHTML=pager(filteredAgtRes().length,agtResPage,'agt-res')">
          <option value="">Todos los estados</option>
          <option>Vendido</option><option>Alquilado</option><option>Custodia</option>
          <option value="Caída">Caída</option><option value="Devolucion">Devolución</option><option value="Redireccion">Redirección</option>
        </select>
      </div>
      <div class="tbl-scroll" id="agt-res-body">${agtResBody()}</div>
      <div class="pager" id="agt-res-pager">${pager(rows.length,agtResPage,'agt-res')}</div>
    </div>`;
}

// ─── ADMIN RENDER ───────────────────────────────────────────────────────────
function render() {
  const tabs=`<div class="tabs">
    <button class="tab-btn ${tab==='resumen'?'active':''}" onclick="setTab('resumen')">Resumen</button>
    <button class="tab-btn ${tab==='agentes'?'active':''}" onclick="setTab('agentes')">Agentes</button>
    <button class="tab-btn ${tab==='reservas'?'active':''}" onclick="setTab('reservas')">Todas las Reservas</button>
  </div>`;
  let content='';
  if(tab==='resumen') content=renderResumen();
  else if(tab==='agentes') content=renderAgtTab();
  else content=renderResTab();
  document.getElementById('app').innerHTML=`<h1 class="page-title">Panel Oficina</h1><p class="page-subtitle">Vista completa · RE/MAX Confluencia</p>${tabs}${content}`;
}

function setTab(t) {
  tab=t;resPage=1;agtPage=1;_filtAgt=null;filteredRes=[...DATA];
  currentAgent=null;document.getElementById('btn-back').classList.remove('show');
  render();
}
</script>
</body>
</html>
